name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # MinVer reads the version off the git history during the build; a shallow checkout
          # finds no tag and warns its way to 0.0.0-alpha.0.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --logger "trx" --results-directory ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./test-results

  # The Docker sample is not part of the solution build, so nothing here noticed when its
  # Dockerfile fell behind the project references it needs — the image had been failing to
  # build for some time before anyone tried. Building it on every PR closes that gap, and the
  # smoke test closes the second half of it: an image that builds but answers wrongly.
  docker:
    runs-on: ubuntu-latest
    steps:
      # No fetch-depth: 0 here — the Dockerfile copies sources, never .git, so MinVer is
      # skipped inside the image regardless of how much history the runner has.
      - uses: actions/checkout@v4

      - name: Build the sample image
        run: docker build -f samples/TLio.Sample.DockerPlugin/Dockerfile -t tlio-sample-docker-plugin:ci .

      - name: Start it
        run: |
          docker run -d --name tlio-ci -p 5000:8080 tlio-sample-docker-plugin:ci
          for i in $(seq 1 60); do
            curl -sf http://localhost:5000/health >/dev/null && exit 0
            sleep 1
          done
          echo "::error::Container did not become healthy within 60s."
          docker logs tlio-ci
          exit 1

      # One transform per format. All three must actually change the document: the endpoint
      # used to ignore its {format} parameter and hand every request to the JSON engine, which
      # answered `success: true` while leaving XML and YAML documents untouched.
      - name: Smoke-test /transform
        run: |
          set -euo pipefail

          check() {
            local format="$1" payload="$2" expect="$3"
            local got
            got=$(curl -sf -X POST "http://localhost:5000/transform/$format" \
                    -H 'Content-Type: application/json' -d "$payload")
            if ! grep -qF "$expect" <<<"$got"; then
              echo "::error::/transform/$format did not apply the script."
              echo "  expected to contain: $expect"
              echo "  got:                 $got"
              return 1
            fi
            echo "/transform/$format OK"
          }

          check json \
            '{"input":{"city":"Utrecht"},"script":[{"command":"add","path":"$.country","value":"NL"}]}' \
            '"country":"NL"'

          check xml \
            '{"input":"<order><city>Utrecht</city></order>","script":[{"command":"add","path":"/order/country","value":"NL"}]}' \
            '<country>NL</country>'

          check yaml \
            '{"input":"city: Utrecht","script":[{"command":"add","path":"$.country","value":"NL"}]}' \
            'country: NL'

          # An unknown format must be rejected, not silently treated as JSON.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:5000/transform/toml \
                   -H 'Content-Type: application/json' -d '{"input":{},"script":[]}')
          if [[ "$code" != "400" ]]; then
            echo "::error::/transform/toml returned $code, expected 400."
            exit 1
          fi
          echo "/transform/toml rejected as expected"

      - name: Container logs
        if: failure()
        run: docker logs tlio-ci

      - name: Stop it
        if: always()
        run: docker rm -f tlio-ci >/dev/null 2>&1 || true
