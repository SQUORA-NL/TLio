name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  test:
    # macOS and Windows as well as Linux: path handling, line endings and (with the locale
    # variable below) number/date formatting are where platform bugs have surfaced before.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # MinVer reads the version off the git history during the build; a shallow checkout
          # finds no tag and warns its way to 0.0.0-alpha.0.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      # The codebase builds with zero warnings; keep it that way.
      - name: Build
        run: dotnet build --no-restore -c Release -warnaserror

      - name: Test
        run: >
          dotnet test --no-build -c Release
          --logger "trx" --results-directory ./test-results
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: ./test-results

  # A non-English decimal separator / date order has broken a fixture before (#54).
  test-locale:
    runs-on: ubuntu-latest
    env:
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: 'false'
      LC_ALL: nl_NL.UTF-8
      LANG: nl_NL.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Install the nl_NL locale
        run: sudo locale-gen nl_NL.UTF-8 && sudo update-locale
      - name: Build and test under nl-NL
        run: |
          dotnet build -c Release -warnaserror
          dotnet test --no-build -c Release --filter "FullyQualifiedName~Parity"

  # The concurrency / data-leakage checks are [Explicit]: forced concurrency is too
  # machine-dependent to gate every push. They do gate a release, so they run when a pull
  # request is opened from a `release/*` branch (and can be run by hand from the Actions tab).
  release-gate:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Build
        run: dotnet build -c Release -warnaserror
      - name: Concurrency and data-leakage regression checks
        run: >
          dotnet test --no-build -c Release
          --filter "FullyQualifiedName~ConcurrentExecutionTests|FullyQualifiedName~CompiledScript_ConcurrencyTests"
          --logger "trx" --results-directory ./release-gate-results
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-results
          path: ./release-gate-results

  # Later runtimes. A library built for net10.0 is consumed by net11.0 and beyond, but "should" is not "does": this job runs
  # the existing net10.0 test builds on the newest runtime available (a preview, until it ships) and fails if the run did not
  # really land on it. It is informational — a preview can break for reasons that are not ours — so it never blocks a merge.
  # When a new .NET reaches GA: add its TFM to Directory.Build.props (docs/target-frameworks.md), then this job moves on to the next preview.
  forward-compat:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      DOTNET_ROLLFORWARD: LatestMajor
      DOTNET_ROLL_FORWARD_TO_PRERELEASE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET (current SDK)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Setup .NET (next runtime, preview)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'
      - name: Build
        run: dotnet build -c Release -p:TargetFrameworks=net10.0
      - name: Prove the tests land on the newer runtime
        run: |
          dotnet test TLio.JsonPath.Tests --no-build -c Release -f net10.0 --filter "FullyQualifiedName~RuntimeReport" --logger "console;verbosity=detailed" | tee runtime.log
          grep -E "RUNTIME: \.NET 1[1-9]" runtime.log
      - name: Test on the newer runtime
        run: dotnet test --no-build -c Release -f net10.0
