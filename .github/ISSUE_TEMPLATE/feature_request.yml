name: Feature request
description: A new command, function, adapter or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The transformation you need, with a sample document if you can.
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Script notation you would like to write, and how it should behave across JSON, XML and YAML.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
