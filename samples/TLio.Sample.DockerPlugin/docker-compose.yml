services:
  tlio-plugin-api:
    image: tlio-sample-docker-plugin:latest
    container_name: tlio-plugin-api
    build:
      context: ../..
      dockerfile: samples/TLio.Sample.DockerPlugin/Dockerfile
      args:
        # Override with TLIO_VERSION=... docker compose build once TLio reaches 1.0 — see the
        # comment at the top of the Dockerfile.
        TLIO_VERSION: ${TLIO_VERSION:-0.0.0-nogit}
    ports:
      - "5000:8080"
    volumes:
      - ./plugins:/plugins
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - NUPLANE_PLUGINS_PATH=/plugins
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
